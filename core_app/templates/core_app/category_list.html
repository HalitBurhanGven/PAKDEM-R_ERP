{% extends "base.html" %}

{% block title %}Kategoriler{% endblock %}

{% block content %}
<h1>Kategoriler</h1>

<table class="table">
    <thead>
        <tr>
            <th>Kategori</th>
            <th>Ürün Sayısı</th>
            <th>Git</th>
        </tr>
    </thead>
    <tbody>
        {% for c in categories %}
        <tr>
            <td>{{ c.category }}</td>
            <td>{{ c.item_count }}</td>
            <td>
                <a class="btn" style="text-decoration:none;" href="{% url 'category_detail' c.category %}">
  Stokları Görün
</a>

                   
                </a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Henüz kategori yok.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
